<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css">
</head>
<body>
<section id="authPage" class="auth-wrap"><div class="auth-card"><h1>Student Management System</h1><p class="text-muted">Full Stack Web Application</p>
<div class="tabs"><button class="active" id="loginTab">Login</button><button id="registerTab">Register</button></div>
<form id="loginForm"><input id="loginUsername" class="form-control mb-3" placeholder="Username" required><input id="loginPassword" type="password" class="form-control mb-3" placeholder="Password" required><button class="btn btn-primary w-100">Login</button></form>
<form id="registerForm" class="d-none"><input id="regName" class="form-control mb-3" placeholder="Full Name" required><input id="regEmail" type="email" class="form-control mb-3" placeholder="Email" required><input id="regUsername" class="form-control mb-3" placeholder="Username" required><input id="regMobile" class="form-control mb-3" placeholder="Mobile"><input id="regPassword" type="password" class="form-control mb-3" placeholder="Password (min 6 characters)" required><button class="btn btn-primary w-100">Create Account</button></form>
<div id="authMsg" class="mt-3"></div></div></section>
<section id="appPage" class="d-none"><nav class="navbar navbar-dark bg-dark px-3"><span class="navbar-brand">Student Management System</span><button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button></nav>
<div class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2>Dashboard</h2><p class="text-muted mb-0">Manage student records and profiles</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#studentModal" id="addBtn"><i class="bi bi-plus-lg"></i> Add Student</button></div>
<div class="row g-3 mb-4"><div class="col-md-4"><div class="stat"><small>Total Students</small><strong id="totalStudents">0</strong></div></div><div class="col-md-4"><div class="stat"><small>Total Courses</small><strong id="totalCourses">0</strong></div></div><div class="col-md-4"><div class="stat"><small>Semesters Used</small><strong id="totalSemesters">0</strong></div></div></div>
<div class="card p-3 mb-4"><div class="d-flex gap-2"><input id="search" class="form-control" placeholder="Search by enrollment, name, email, course..."><button class="btn btn-outline-secondary" id="refreshBtn">Refresh</button></div></div>
<div class="card p-3"><h4>Student Records</h4><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Enrollment</th><th>Name</th><th>Email</th><th>Course</th><th>Sem</th><th>Division</th><th>Actions</th></tr></thead><tbody id="studentTable"></tbody></table></div></div>
<div class="card p-4 mt-4"><h4>My Profile</h4><form id="profileForm" class="row g-3"><div class="col-md-4"><label>Full Name</label><input id="profileName" class="form-control" required></div><div class="col-md-4"><label>Email</label><input id="profileEmail" type="email" class="form-control" required></div><div class="col-md-4"><label>Mobile</label><input id="profileMobile" class="form-control"></div><div class="col-12"><button class="btn btn-success">Update Profile</button></div></form></div>
</div></section>
<div class="modal fade" id="studentModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><form id="studentForm"><div class="modal-header"><h5 id="modalTitle">Add Student</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="studentId"><div class="row g-3"><div class="col-md-6"><label>Enrollment No</label><input id="enrollmentNo" class="form-control" required></div><div class="col-md-6"><label>Full Name</label><input id="studentName" class="form-control" required></div><div class="col-md-6"><label>Email</label><input id="studentEmail" type="email" class="form-control" required></div><div class="col-md-6"><label>Mobile</label><input id="studentMobile" class="form-control"></div><div class="col-md-6"><label>Course</label><input id="course" class="form-control" placeholder="B.E. IT" required></div><div class="col-md-3"><label>Semester</label><input id="semester" type="number" min="1" max="12" class="form-control" required></div><div class="col-md-3"><label>Division</label><input id="division" class="form-control" placeholder="A"></div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save Student</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script></body></html>
